# edie_imu_node:
#   ros__parameters:
#     # Kalman Filter Parameters
#     accl_x_P: 1.0
#     accl_y_P: 1.0
#     accl_z_P: 1.0
#     gyro_x_P: 1.0
#     gyro_y_P: 1.0
#     gyro_z_P: 1.0
#     accl_Q: 0.0001             # 값이 클수록 -> KG 증가 -> measurement 가중치 증가 -> 반응성 증가 but 부드러움 감소(0.000001)
#     gyro_Q: 0.0001
#     accl_R: 0.0005                # 값이 클수록 -> KG 감소 -> estimated 가중치 증가 -> 부드러움 증가 but 반응성 감소
#     gyro_R: 0.01
#     # Low Pass Filter Parameters
#     lpf_accel_cutoff: 3.0         # 0.2 -> 0.5 -> (Apr 10) 3.0 or 3.5         
#     lpf_gyro_cutoff: 3.5          # 0.5 -> (Apr 10) 1.0 -> 3.0 or 3.5    
#     # Zero Velocity Detection Parameters
#     zero_vel_accel_threshold: 1.02  # [g] 단위에서 오차 허용 범위
#     zero_vel_gyro_threshold: 10.0   # [deg/s] 단위에서 오차 허용 범위   

edie_imu_node:
  ros__parameters:
    use_low_pass_filter: true
    use_kalman_filter: false
    sample_freq: 400
    # Kalman Filter Parameters
    Q_cov: 0.000005          # 0.00001 -> 0.000005(by far best)
    R_cov: 0.0001            # 0.0005 -> 0.0001(by far best)  
    # Low Pass Filter Parameters
    lpf_accel_cutoff: 12.0  # 0.7 -> 2.0 -> 5.0(반응성-outlier 제거 Trade-off best)   
    lpf_gyro_cutoff: 12.0   # 0.8 -> 2.0 -> 6.0(반응성-outlier 제거 Trade-off best)     -> 10.0(?)
    # One Euro Filter Parameters
    min_cutoff: 0.1   # 1.0 -> 0.3 -> 0.1 (by far best)
    beta: 2.0        # 0.02 -> 1.0 -> 
    dcutoff: 1.0  
    # Zero Velocity Detection Parameters
    zero_vel_accel_threshold: 1.0  #0.5 #0.04  # [g] 단위에서 오차 허용 범위
    zero_vel_gyro_threshold: 1.0   # [deg/s] 단위에서 오차 허용 범위   