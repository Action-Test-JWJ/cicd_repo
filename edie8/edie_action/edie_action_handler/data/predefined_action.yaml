## emotion_index[emo] : emotion_state
## 옵션이 있으면 후보에서 랜덤 선택, 없으면 display_index/sound_index 단일 기본값으로 동작

# CURIOUS
1:
  display_index: 1
  sound_index: 4
  motion_index: 1


# SLEEPY
2:
  display_index: 2
  sound_index: 0
  motion_index: 2


# AMUSED
3:
  display_index: 3
  sound_index: 3
  motion_index: 3
  display_options: [3, 4] # AMUSED, HOPEFUL
  sound_options: [1, 2, 3]   # laugh_001.wav, laugh_002.wav, admiration_001.wav


# HOPEFUL
4:
  display_index: 4
  sound_index: 1
  motion_index: 4
  display_options: [3, 4] # AMUSED, HOPEFUL
  sound_options: [1, 2, 3]   # laugh_001.wav, laugh_002.wav, admiration_001.wav


# CRYING
5:
  display_index: 5       
  sound_index: 5      
  motion_index: 5

# SURPRISED
6:
  display_index: 6
  sound_index: 6
  motion_index: 6
  display_options: [6, 7] # SURPRISED, SURPRISED_2

# SURPRISED_2
7:
  display_index: 7
  sound_index: 6
  motion_index: 7
  display_options: [6, 7] # SURPRISED, SURPRISED_2

# DISAPPOINTED
8:
  display_index: 8
  sound_index: 7
  motion_index: 8

# LOVE
9:
  display_index: 9
  sound_index: 9
  motion_index: 9

# DIZZY
10:
  display_index: 10
  sound_index: 8
  motion_index: 11

# DIZZY_2
11:
  display_index: 11
  sound_index: 8
  motion_index: 11