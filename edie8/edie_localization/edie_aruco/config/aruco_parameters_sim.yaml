/aruco_detection_node:
  ros__parameters:
    aruco_dictionary_id: "DICT_5X5_1000"
    corner_refinement: "SUBPIX"
    gap_size: 0.02
    
    docking_marker_size: 0.07
    docking_marker_ids: [2, 1]
    
    # docking_board_pose: [x, y, z, roll, pitch, yaw] in map frame
    docking_board_pose: [-0.03, 0.0, 0.2, 1.5708, 0.0, -1.5708]
    
    localization_marker_size: 0.3
    localization_marker_ids: [0, 101, 201, 301]

    # 각 마커의 map 기준 pose [x, y, z, roll, pitch, yaw] (단위: meter, radian)
    aruco_marker_position:
      "0": [-0.01, 0.0, 0.5, 1.5708, 0.0, -1.5708]
      "101": [-2.0, 2.49, 0.5, 1.5708, 0.0, 0.0]
      "201": [-3.99, 0.0, 0.5, 1.5708, 0.0, 1.5708]
      "301": [-2.0, -2.49, 0.5, 1.5708, 0.0, 3.14]

    image_topic: "/rgb/image_raw/compressed"
    camera_info_topic: "/edie8/vision/camera_info"
    camera_frame: "camera_link"
    visualize: true